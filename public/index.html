<script>
/* 구조 위치공유 시스템
   ※ 소스(src/)가 없어 빌드 결과물(public/index.html)에 직접 심었다.
   ※ 방 안쪽 기능은 실제 재난 방을 만들어야 볼 수 있어(운영 데이터가 생긴다)
     첫 화면에서 확인한 것만 짚는다. */
window.TOUR_STEPS = [
  {
    sel: '.room-list',
    when: '먼저',
    title: '★ 새로 만들기 전에 목록부터 보세요.',
    body: '이미 열려 있는 현장이 있으면 여기 뜹니다.\n같은 현장을 두 번 만들면 대원과 요구조자가 서로 다른 방에 들어가게 됩니다.'
  },
  {
    sel: '.new-disaster-btn',
    when: '목록에 없을 때',
    title: '목록에 없을 때만 새로 만듭니다.',
    body: '현장 하나에 방 하나입니다.'
  },
  {
    sel: null,
    when: '들어간 뒤',
    title: '요구조자는 링크만 있으면 됩니다.',
    body: '앱을 깔 필요 없이 받은 링크로 바로 들어옵니다.\n들어오는 즉시 위치가 지도에 나타나 현장 지휘에 쓸 수 있습니다.'
  }
];
</script>
<!-- ══════════════════════════════════════════════════════════════════
     가이드 투어 — 처음 쓰는 사람이 밟을 자리를 차례로 짚는다.
     ★ 보여 주기만 한다. 값은 하나도 안 고친다 — 자리를 밝히고 설명을
       띄우는 것이 전부다. 닫으면 보던 자리로 돌려놓는다.
     ★ 짚는 자리는 「이미 화면에 글로 적혀 있는 것」을 뺀 것들이다.
       안내문에 있는 말을 되풀이하면 읽지 않게 된다.
     ★ 앱마다 CSS 가 제각각이라 이름은 전부 tour- 로 시작하고,
       아래 「담 쌓기」로 앱의 button/p/h3 규칙이 새어 들어오지 못하게 막는다.
       (실제로 button.primary{width:100%} 같은 규칙에 말풍선이 망가졌었다)
     ══════════════════════════════════════════════════════════════════ -->
<style>
/* ── 담 쌓기: 앱 CSS 가 투어 안으로 새어 들어오지 못하게 ────────── */
#tour, #tour *, #tourBtn{
  box-sizing:border-box; float:none; text-transform:none; letter-spacing:normal;
  text-align:left; text-indent:0; text-shadow:none;
}
/* ★ 초기화는 말풍선 「안쪽」에만 건다. #tour div 같은 선택자는 #tourBox 보다
   특정도가 높아서 링과 말풍선의 position:fixed 까지 덮어써 자리를 통째로
   망가뜨린다(실제로 한 번 밟았다). 여기 있는 것들은 전부 특정도 (1,0,0) 이라
   뒤에 오는 #tourNum·#tourTitle 같은 규칙이 동점으로 이긴다. */
#tourBox > *, #tourBox > * > *{
  margin:0; padding:0; width:auto; height:auto; min-width:0; max-width:none;
  min-height:0; position:static; transform:none; flex:0 0 auto; border:0;
  background:none; box-shadow:none; opacity:1; visibility:visible; float:none;
}

/* ── 투어 본체 ──────────────────────────────────────────────────── */
#tour[hidden]{display:none}
#tour{position:fixed; inset:0; z-index:2147483000}
/* 짚는 자리 — 테두리만 두르고, 바깥은 거대한 box-shadow 로 한꺼번에 어둡게 만든다.
   (네 조각으로 가리는 것보다 간단하고, 자리가 옮겨질 때 어긋나지 않는다) */
#tourRing{
  position:fixed; border-radius:6px; pointer-events:none;
  outline:3px solid #1d8a4e; box-shadow:0 0 0 9999px rgba(16,24,32,.6);
}
#tourBox{
  position:fixed; width:330px; max-width:calc(100vw - 24px);
  background:#fff; color:#1f2937; border-radius:10px; padding:13px 15px 11px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  line-height:normal;
}
#tourBox .tour-step{display:flex; align-items:center; gap:7px; font-size:11.5px; margin-bottom:5px}
#tourNum{color:#1d8a4e; font-weight:700; font-size:11.5px}
#tourWhen{color:#6b7280; border:1px solid #e5e7eb; border-radius:9px; padding:1px 7px; font-size:11.5px}
#tourTitle{font-size:13.5px; font-weight:700; margin-bottom:5px; letter-spacing:-.2px; color:#111827; line-height:1.45}
#tourBody{font-size:12.5px; line-height:1.62; color:#374151; white-space:pre-line}
#tourBox .tour-bar{display:flex; align-items:center; gap:6px; margin-top:11px}
#tourBox .tour-sp{flex:1 1 auto}
#tourBox button{
  font-family:inherit; font-size:12px; font-weight:600; white-space:nowrap;
  padding:5px 11px; border-radius:7px; cursor:pointer;
  border:1px solid #d1d5db; background:#fff; color:#374151;
}
#tourBox button:hover{background:#f9fafb}
#tourBox button[disabled]{opacity:.4; cursor:not-allowed}
#tourBox button.tour-ghost{border-color:transparent; color:#9ca3af; font-weight:500}
#tourBox button.tour-ghost:hover{background:#f3f4f6}
#tourBox button.tour-primary{background:#1d8a4e; border-color:#1d8a4e; color:#fff}
#tourBox button.tour-primary:hover{background:#177040}
/* 이 단추는 눌러도 아무것도 저장되지 않는다 — 속이 빈 테두리형으로 구분한다 */
#tourBtn{
  position:fixed; right:16px; bottom:16px; z-index:2147482000;
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  font-size:13px; font-weight:700; white-space:nowrap; padding:9px 15px; margin:0;
  border-radius:999px; cursor:pointer; width:auto; height:auto; opacity:1;
  border:1px solid #1d8a4e; background:rgba(255,255,255,.96); color:#1d8a4e;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
#tourBtn:hover{background:#eaf6ef; opacity:1}
/* 투어는 화면에서만 쓰는 것이다 — 인쇄에는 흔적도 남지 않는다 */
@media print{ #tour, #tourBtn{display:none !important} }
</style>

<button id="tourBtn" type="button" title="처음 쓰시는 분은 여기부터 — 화면을 짚어 가며 알려 드립니다">사용법 안내</button>
<div id="tour" hidden role="dialog" aria-modal="true" aria-label="사용법 안내">
  <div id="tourRing"></div>
  <div id="tourBox">
    <div class="tour-step"><span id="tourNum"></span><span id="tourWhen"></span></div>
    <div id="tourTitle"></div>
    <div id="tourBody"></div>
    <div class="tour-bar">
      <button type="button" class="tour-ghost" id="tourQuit">그만 보기</button>
      <span class="tour-sp"></span>
      <button type="button" id="tourPrev">이전</button>
      <button type="button" class="tour-primary" id="tourNext">다음</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var TOUR = window.TOUR_STEPS || [];
  if (!TOUR.length) { var b0 = $("#tourBtn"); if (b0) b0.style.display = "none"; return; }

  var at = -1, homeScroll = 0, raf = 0;

  /* ★ zoom 을 쓰는 앱이 있다 — 소방차 적재는 사용자가 화면 배율을 조절하고
     app.js 가 html 의 zoom 을 런타임에 바꾼다.
     getBoundingClientRect·innerWidth 는 화면 좌표인데 style 에 쓰는 px 에는
     zoom 이 곱해져, 그대로 두면 링과 말풍선이 배율만큼 밀린다.
     투어에 역배율을 걸어 안쪽을 화면 좌표와 1:1 로 맞춘다 — 그러면 아래 계산은
     zoom 을 몰라도 된다. 배율이 도중에 바뀌므로 place() 마다 확인한다. */
  var lastZoom = 0;
  function syncZoom() {
    var z = 1, el = $("#tour").parentElement;
    while (el) { z *= parseFloat(getComputedStyle(el).zoom) || 1; el = el.parentElement; }
    if (!z) z = 1;
    if (z === lastZoom) return;
    lastZoom = z;
    var inv = z === 1 ? "" : String(1 / z);
    $("#tour").style.zoom = inv;
    $("#tourBtn").style.zoom = inv;
  }
  syncZoom();

  /* 단추 자리 — 앱마다 비어 있는 모서리가 다르다.
     steps 파일에서 window.TOUR_BTN_POS = "bottom-left" 처럼 정해 준다.
     (실제로 소방펌프차는 오른쪽 아래에 [강의보러가기]가 이미 앉아 있었다) */
  (function () {
    var b = $("#tourBtn"), pos = window.TOUR_BTN_POS || "bottom-right";
    b.style.top = b.style.bottom = b.style.left = b.style.right = "auto";
    if (pos.indexOf("top") === 0) b.style.top = "16px"; else b.style.bottom = "16px";
    if (pos.indexOf("left") >= 0) b.style.left = "16px"; else b.style.right = "16px";
  })();

  /* 아직 안 열린 화면(시험 시작 전의 문항 목록 같은 것)은 문서에는 있어도
     크기가 0 이다. 그런 것을 짚으면 링이 화면 구석에 조각으로 남는다 —
     아예 없는 것으로 보고 설명만 가운데에 띄운다. */
  function findTarget(s) {
    if (!s || !s.sel) return null;
    var el = document.querySelector(s.sel);
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return (r.width || r.height) ? el : null;
  }

  /* 짚은 자리에 테두리를 두르고 그 옆에 말풍선을 놓는다.
     ★ 화면보다 큰 것은 위쪽만 짚는다 — 링이 화면을 넘으면
       어디가 짚인 곳인지 되레 안 보인다. */
  function place() {
    var s = TOUR[at]; if (!s) return;
    syncZoom();
    var ring = $("#tourRing"), box = $("#tourBox");
    var el = findTarget(s);
    var bh = box.offsetHeight, bw = box.offsetWidth;
    var vh = window.innerHeight, vw = window.innerWidth;
    if (!el) {                       // 못 찾으면 설명만 가운데에 (화면이 바뀌어도 안 멈추게)
      ring.style.display = "none";
      box.style.left = Math.max(8, (vw - bw) / 2) + "px";
      box.style.top = "96px";
      return;
    }
    ring.style.display = "";
    var r = el.getBoundingClientRect(), pad = 6, gap = 12;
    var top = Math.max(8, r.top - pad);
    var h = Math.max(20, Math.min(r.height + pad * 2, vh - top - 8));
    var left = Math.max(4, r.left - pad);
    var width = Math.min(r.width + pad * 2, vw - 8);
    ring.style.top = top + "px"; ring.style.height = h + "px";
    ring.style.left = left + "px"; ring.style.width = width + "px";

    /* 말풍선은 짚어 놓은 자리를 절대 가리면 안 된다 — 가리면 밝혀 놓은 뜻이 없다.
       아래 → 위 → 오른쪽 → 왼쪽 순으로 빈 곳을 찾고, 어디에도 안 들어가면
       그때만 화면 안으로 밀어 넣는다. */
    var cT = function (v) { return Math.max(8, Math.min(v, vh - bh - 8)); };
    var cL = function (v) { return Math.max(8, Math.min(v, vw - bw - 8)); };
    if (top + h + gap + bh <= vh - 8)           { box.style.top = (top + h + gap) + "px"; box.style.left = cL(r.left) + "px"; }
    else if (top - gap - bh >= 8)               { box.style.top = (top - gap - bh) + "px"; box.style.left = cL(r.left) + "px"; }
    else if (left + width + gap + bw <= vw - 8) { box.style.top = cT(top) + "px"; box.style.left = (left + width + gap) + "px"; }
    else if (left - gap - bw >= 8)              { box.style.top = cT(top) + "px"; box.style.left = (left - gap - bw) + "px"; }
    else                                        { box.style.top = cT(top + h + gap) + "px"; box.style.left = cL(r.left) + "px"; }
  }

  function show(i) {
    at = Math.max(0, Math.min(TOUR.length - 1, i));
    var s = TOUR[at];
    /* 화면을 넘겨 주는 것은 투어가 한다(따라가기만 하면 되게).
       before 는 탭을 열거나 접힌 것을 펼치는 등 「보여 주기」만 한다. */
    if (typeof s.before === "function") { try { s.before(); } catch (e) {} }
    $("#tourNum").textContent = (at + 1) + " / " + TOUR.length;
    $("#tourWhen").textContent = s.when || "";
    $("#tourWhen").style.display = s.when ? "" : "none";
    $("#tourTitle").textContent = s.title || "";
    $("#tourBody").textContent = s.body || "";
    $("#tourBody").style.display = s.body ? "" : "none";
    $("#tourPrev").disabled = at === 0;
    $("#tourNext").textContent = at === TOUR.length - 1 ? "마침" : "다음";
    $("#tour").hidden = false;
    var el = findTarget(s);
    // 이 앱에 scroll-behavior:smooth 가 걸려 있어도 투어만은 즉시 옮긴다
    if (el) { try { el.scrollIntoView({ block: "center", behavior: "instant" }); } catch (e) { el.scrollIntoView(); } }
    place();
  }

  /* 자리를 매 프레임 다시 잰다 — 스크롤·펼침 애니메이션·창 크기 변화를
     따로 듣지 않아도 링이 절대 어긋나지 않는다. */
  function loop() { if (at >= 0) { place(); raf = requestAnimationFrame(loop); } }

  function start() { homeScroll = window.pageYOffset; show(0); cancelAnimationFrame(raf); loop(); }
  function end() {
    $("#tour").hidden = true; at = -1; cancelAnimationFrame(raf);
    // 투어가 펼쳐 놓은 것이 있으면 앱이 도로 접는다
    if (typeof window.TOUR_ON_END === "function") { try { window.TOUR_ON_END(); } catch (e) {} }
    // 보던 자리로 돌려놓는다 — 투어가 화면을 옮겨 놓고 가면 안 된다
    window.scrollTo(0, homeScroll);
  }

  $("#tourBtn").onclick = start;
  $("#tourQuit").onclick = end;
  $("#tourPrev").onclick = function () { if (at > 0) show(at - 1); };
  $("#tourNext").onclick = function () { if (at === TOUR.length - 1) end(); else show(at + 1); };
  /* 키보드 — Esc 로 닫고 ← → 로 옮긴다 */
  document.addEventListener("keydown", function (e) {
    if ($("#tour").hidden) return;
    if (e.key === "Escape") end();
    else if (e.key === "ArrowRight" && at < TOUR.length - 1) show(at + 1);
    else if (e.key === "ArrowLeft" && at > 0) show(at - 1);
  });
})();
</script>

</body></html>
